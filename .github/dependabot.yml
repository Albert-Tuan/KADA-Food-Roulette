# Dependabot config for Food Roulette monorepo
# Reference: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  # Backend (Node + Express + Prisma)
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      production:
        dependency-type: "production"
      development:
        dependency-type: "development"

  # Mobile (Expo + React Native)
  - package-ecosystem: "npm"
    directory: "/apps/mobile"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "mobile"
    # Expo SDK packages must bump together ΓÇö group to avoid breaking builds
    groups:
      expo-sdk:
        patterns:
          - "expo*"
          - "@expo/*"
      react-native:
        patterns:
          - "react-native"
          - "react-native-*"
          - "@react-native/*"

  # Web (React + Vite)
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "web"

  # GitHub Actions (keep workflows healthy)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
