name: Mobile iOS CI

on:
  push:
    branches: [main, develop, 'feature/**']
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci-ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'

defaults:
  run:
    working-directory: apps/mobile

jobs:
  lint-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  eas-ios-build:
    name: EAS iOS Build (Preview)
    runs-on: ubuntu-latest
    needs: lint-typecheck
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Expo
        uses: expo/expo-github-action@v9
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: EAS Build (iOS preview)
        uses: expo/expo-github-action@v9
        with:
          eas-build: true
          platform: ios
          profile: preview
