services:
  mysql:
    image: mysql:8.0
    container_name: food-roulette-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-food_roulette}
      MYSQL_USER: ${MYSQL_USER:-food_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-foodpassword}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
      target: migrator
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-food_user}:${MYSQL_PASSWORD:-foodpassword}@mysql:3306/${MYSQL_DATABASE:-food_roulette}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
      target: runner
    container_name: food-roulette-backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-food_user}:${MYSQL_PASSWORD:-foodpassword}@mysql:3306/${MYSQL_DATABASE:-food_roulette}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mysql_data:
    driver: local
